<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Recupere seu acesso ao DevMind</title>
  </head>
  <body>
    <h1>Recupere seu acesso ao DevMind</h1>
    <p>Digite este código na página de confirmação do DevMind e selecione “Estou recuperando minha senha”.</p>
    <p style="font-size: 32px; font-weight: bold; letter-spacing: 6px;">{{ .Token }}</p>
    <p><a href="{{ .SiteURL }}/verificar">Abrir a página de confirmação</a></p>
    <p>O código é de uso único. Se você não pediu a recuperação, ignore este email.</p>
  </body>
</html>
