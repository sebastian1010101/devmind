<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Confirme seu email no DevMind</title>
  </head>
  <body>
    <h1>Confirme seu email no DevMind</h1>
    <p>Digite este código na página de confirmação do DevMind.</p>
    <p style="font-size: 32px; font-weight: bold; letter-spacing: 6px;">{{ .Token }}</p>
    <p><a href="{{ .SiteURL }}/verificar">Abrir a página de confirmação</a></p>
    <p>O código é de uso único. Se você não criou esta conta, ignore este email.</p>
  </body>
</html>
